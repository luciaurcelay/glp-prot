# Config for the COMPLETED 100M-activation run (runs/uniref50_100m). Identical to the
# canonical configs/esm8m_h100.yaml except output_dir and n_train_activations, so it
# routes run_probing / make_report at the already-trained 100M checkpoint + eval store
# rather than the canonical config's 500M run (runs/uniref50_500m).
#
# Why this exists despite "config unification" (see esm8m_h100.yaml header): output_dir
# is the only handle run_probing/make_report have on which run to read, and there is no
# CLI override for it. This is a post-hoc probing target for an existing run, not a new
# training config — n_train_activations is set to 100M for accuracy but is unused by
# probing/reporting. Use configs/esm8m_h100.yaml for the ongoing 500M training/resume.

device: cuda
precision: fp32
seed: 0
output_dir: runs/uniref50_100m

model:
  activation_dim: 320
  d_model: null         # -> 640
  d_mlp: null           # -> 1280; meta-neurons = 6 * 1280 = 7,680
  n_blocks: 6

data:
  model_name: facebook/esm2_t6_8M_UR50D
  layer: 4
  n_train_activations: 100000000   # the completed run's scale (unused by probing/report)
  store_mode: precache
  activation_dtype: float16
  train_fasta: uniref50
  eval_uniprot_tsv: null
  n_shards: 8
  valid_shard_range: [0, 3]
  test_shard_range: [4, 7]
  min_aa_per_concept: 1500
  min_domains_per_concept: 25

diffusion:
  num_train_timesteps: 1000

sampler:
  num_steps: 20
  fd_num_steps: 1000
  t_start: 1.0

train:
  lr: 5.0e-5
  batch_size: 512
  num_epochs: 1
  warmup_ratio: 0.01
  lr_initial_factor: 0.01
  lr_final_factor: 0.1
  grad_clip: 1.0
  log_every_n_steps: 50

probing:
  u_grid: [0.1, 0.5, 0.9]
  topk: 512
  seed: 42
