# ESM-2-650M depth-scaling grid — 100M UniRef50 activations, batch 4096, cell = 6 blocks.
# Metric A (FD depth scan) at 650M / layer 18, mirroring configs_lucia's 8M grid so the two
# FD-vs-n_blocks curves are directly comparable (docs/plan_650m_scaling.md). Only n_blocks
# and output_dir vary across cells; all four share the one extracted 650M/layer-18 store via
# data.store_dir (no re-extraction — activations depend only on data/model/layer/seed).
#
# Layer 18 chosen by the raw-layer probe pilot (L18 0.8509 vs L24 0.8438 mean AUC, p=3e-4).
# This 6-block cell: ~250M params, 6*5120 = 30,720 meta-neurons.
#
# Extraction (run ONCE, any cell — they share store_dir):
#   sbatch --account=ehpc394 --qos=acc_ehpc --time=08:00:00 \
#     scripts/cluster/submit_extract_activations.sh configs/esm650m_100m_4096_d6.yaml 600000
#   (auto-excludes the eval set via swissprot_annotated_eval_20000.tsv; writes train_manifest.json)

device: cuda
precision: fp32
seed: 0
output_dir: runs/esm650m_100m_4096_d6

model:
  activation_dim: 1280      # ESM-2-650M d; -> d_model 2560, d_mlp 5120
  d_model: null
  d_mlp: null
  n_blocks: 6

data:
  model_name: facebook/esm2_t33_650M_UR50D
  layer: 18
  n_train_activations: 100000000
  store_mode: precache
  activation_dtype: float16
  train_fasta: uniref50
  store_dir: esm650m_100m_l18/train_store   # shared 650M/layer-18 store (no re-extract)
  eval_uniprot_tsv: null
  n_shards: 8
  valid_shard_range: [0, 3]
  test_shard_range: [4, 7]
  min_aa_per_concept: 1500
  min_domains_per_concept: 25

diffusion:
  num_train_timesteps: 1000

sampler:
  num_steps: 20
  fd_num_steps: 1000
  t_start: 1.0

train:
  lr: 5.0e-5
  batch_size: 4096
  num_epochs: 1
  warmup_ratio: 0.01
  lr_initial_factor: 0.01
  lr_final_factor: 0.1
  grad_clip: 1.0
  log_every_n_steps: 50

probing:
  u_grid: [0.1, 0.5, 0.9]
  topk: 512
  seed: 42
