# Canonical cluster config — GLP spine on MN5/H100, 100M-activation UniRef50, batch 4096.
#
# Depth scan (n_blocks 3/6/12/24, mirroring configs_lucia's 500M grid): this file is the
# driver — data.store_dir pins it to the already-extracted 100M store, so between
# iterations just edit model.n_blocks and output_dir (e.g. runs/uniref50_100m_4096_d3),
# then resubmit train + eval_generation. Current: n_blocks 6 / runs/uniref50_100m_4096 (d6).

device: cuda
precision: fp32
seed: 0
output_dir: runs/uniref50_100m_4096_b12

model:
  activation_dim: 320
  d_model: null         # -> 640
  d_mlp: null           # -> 1280
  n_blocks: 12

data:
  model_name: facebook/esm2_t6_8M_UR50D
  layer: 4
  n_train_activations: 100000000
  store_mode: precache
  activation_dtype: float16
  train_fasta: uniref50
  store_dir: uniref50_100m_4096/train_store   # reuse extracted store (no re-extract)
  # eval_dir: uniref50_100m_4096/swissprot/processed   # uncomment to also probe
  eval_uniprot_tsv: null
  n_shards: 8
  valid_shard_range: [0, 3]
  test_shard_range: [4, 7]
  min_aa_per_concept: 1500
  min_domains_per_concept: 25

diffusion:
  num_train_timesteps: 1000

sampler:
  num_steps: 20
  fd_num_steps: 1000
  t_start: 1.0

train:
  lr: 5.0e-5
  batch_size: 4096
  num_epochs: 1
  warmup_ratio: 0.01
  lr_initial_factor: 0.01
  lr_final_factor: 0.1
  grad_clip: 1.0
  log_every_n_steps: 50

probing:
  u_grid: [0.1, 0.5, 0.9]
  topk: 512
  seed: 42
