# Minimum-compute smoke test (crg562661, 2026-08-10) — verify the cluster pipeline is
# wired up end-to-end before running/joining a real scale point. Identical to
# configs/esm8m_h100.yaml (model/diffusion/sampler/train/probing blocks — hook parity,
# SAE compatibility, and batch_size=512 must stay untouched) except:
#   - output_dir: a fresh run name, so this never touches Dani's runs/uniref50_100m or
#     runs/uniref50_500m (RUN_NAME is derived solely from this field — see
#     scripts/cluster/submit_pipeline.sh).
#   - n_train_activations: 200_000 instead of 500M — extract_activations.py stops the
#     writer at cfg.data.n_train_activations regardless of how many sequences are
#     available (store.write(..., max_rows=...)), so this is the actual compute lever.
# Reuses Dani's already-prefetched shared uniref50.fasta.gz and the n_prot=20000
# Swiss-Prot eval TSV (both already on $GLP_DATA_ROOT) — no new prefetch needed.

device: cuda
precision: fp32
seed: 0
output_dir: runs/smoke_test_crg

model:
  activation_dim: 320
  d_model: null         # -> 640
  d_mlp: null           # -> 1280; meta-neurons = 6 * 1280 = 7,680
  n_blocks: 6

data:
  model_name: facebook/esm2_t6_8M_UR50D
  layer: 4
  n_train_activations: 200000      # smoke-test scale, not a real result
  store_mode: precache
  activation_dtype: float16
  train_fasta: uniref50            # reservoir-sampled from the already-prefetched local pull
  eval_uniprot_tsv: null
  n_shards: 8
  valid_shard_range: [0, 3]
  test_shard_range: [4, 7]
  min_aa_per_concept: 1500
  min_domains_per_concept: 25

diffusion:
  num_train_timesteps: 1000

sampler:
  num_steps: 20
  fd_num_steps: 1000
  t_start: 1.0

train:
  lr: 5.0e-5
  batch_size: 512
  num_epochs: 1
  warmup_ratio: 0.01
  lr_initial_factor: 0.01
  lr_final_factor: 0.1
  grad_clip: 1.0
  log_every_n_steps: 50

probing:
  u_grid: [0.1, 0.5, 0.9]
  topk: 512
  seed: 42
